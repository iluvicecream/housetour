<!DOCTYPE html>
<html>
    <head>
        <!-- 𐔌՞. .՞𐦯 -->
        <!-- Hi there!-->
        <title>come here</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="favicon.ico"/>
        <script src="https://unpkg.com/favloader@0.4.4/favloader.min.js"></script>
        <script src="https://unpkg.com/favloader@0.4.4/parseGIF.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti"></script>
        <script>
            favloader.init({
                gif: 'favicon-gif.gif'
            });
            favloader.start();
        </script>

        <link rel="stylesheet" href="font.css">
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <div class="centerbox">
            <div class="curtime">
                <h1 id="currenttime-text" class="currenttime"></h1>
                <h3 id="currenttime-title" class="currenttime-title">you should sleep tbh</h3>
                <p id="currenttime-description" class="currenttime-description">my site will still be here tmr dont worry</p>
                
                <div class="menugrid">
                    <a href="projects.html" class="menuitem">projects</a>
                    <a href="https://github.com/iluvicecream" class="menuitem">github</a>
                    <a href="https://perr.dev/blog" class="menuitem">blog</a>
                </div>

                <p class="boat">⊹ ࣪ ﹏﹏𓊝﹏𓂁﹏ ⊹˖</p>
            </div>

            <footer>
                <p>𐔌՞. .՞𐦯<button id="applebtn" class="applebtn">🍎</button> ༘⋆</p>
            </footer>
        </div>

        <script>
            const currentTime = new Date().getHours();; 
            if(currentTime >= 5 && currentTime < 12) {
                document.getElementById("currenttime-text").textContent = "";
                document.getElementById("currenttime-text").classList.add("morning");
                document.getElementById("currenttime-title").classList.add("morning");
                document.getElementById("currenttime-title").textContent = "oh hi there!";
                document.getElementById("currenttime-description").textContent = "me hope you have a good day";
            } else if(currentTime >= 12 && currentTime < 15) {
                document.getElementById("currenttime-text").textContent = "";
                document.getElementById("currenttime-text").classList.add("afternoon");
                document.getElementById("currenttime-title").classList.add("afternoon");
                document.getElementById("currenttime-title").textContent = "doing good?";
                document.getElementById("currenttime-description").textContent = "how was your lunch huh";
            } else if(currentTime >= 15 && currentTime < 19) {
                document.getElementById("currenttime-text").textContent = "";
                document.getElementById("currenttime-text").classList.add("evening");
                document.getElementById("currenttime-title").classList.add("evening");
                document.getElementById("currenttime-title").textContent = "dont fall asleep just yet";
                document.getElementById("currenttime-description").textContent = "wat did you have for dinner?";
            } else {
                document.getElementById("currenttime-text").textContent = "";
                document.getElementById("currenttime-text").classList.add("night");
                document.getElementById("currenttime-title").classList.add("night");
                document.getElementById("currenttime-title").textContent = "go to sleep pls";
                document.getElementById("currenttime-description").textContent = "you should sleep tbh";
            }

            const appleBrainImg = new Image();

            const applebtn = document.getElementById("applebtn");
            applebtn.addEventListener("click", function() {
                confetti({
                    spread: 180,
                    ticks: 500,
                    gravity: 1,
                    decay: .94,
                    startVelocity: 30,
                    particleCount: 12,
                    scalar: 6,
                    shapes: ["image"],
                    shapeOptions: {
                        image: [{
                            src: "favicon-32x32.png",
                            width: 32,
                            height: 32
                        }]
                        }
                    });
            });

            var textValue = [0,0,0,0,0,0];
            var boatIndex = 3;
            var sharkIndex = 5;
            //each second
            setInterval(function(){
                var constructText = "";

                if(boatIndex == 0){
                    boatIndex = 5;
                }else{
                    boatIndex--;
                }

                if(sharkIndex == 0){
                    sharkIndex = 5;
                }else{
                    sharkIndex--;
                }
                for(var i = 0; i < textValue.length; i++){
                    if(i == boatIndex){
                        constructText += "𓊝";
                    }else if(i == sharkIndex){
                        constructText += "𓂁";
                    }else{
                        constructText += "﹏";
                    }
                }
                document.getElementsByClassName("boat")[0].innerHTML = "⊹ ࣪ " + constructText + " ⊹˖";
            },1000);
        </script>
    </body>

</html>
